<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>世豐 SHIFENG — 奇萊山單一產區高山茶</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;700&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   SHIFENG TEA · QILAI MOUNTAIN — base stylesheet
   3 variants: ink (default dark) · mist (light) · gold (luxury)
   ============================================================ */

:root {
  --f-display: "Cormorant Garamond", "Noto Serif TC", "Songti SC", Georgia, serif;
  --f-body: "Noto Serif TC", "Songti SC", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-sans: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;

  /* INK (default dark) */
  --bg: oklch(0.155 0.012 145);
  --bg-2: oklch(0.195 0.014 145);
  --bg-3: oklch(0.235 0.014 142);
  --fg: oklch(0.92 0.012 130);
  --fg-2: oklch(0.74 0.018 130);
  --fg-3: oklch(0.52 0.018 130);
  --line: oklch(0.32 0.014 140);
  --line-soft: oklch(0.26 0.012 140);
  --accent: oklch(0.78 0.10 132);
  --accent-2: oklch(0.62 0.08 135);
  --paper: oklch(0.92 0.012 130);
}

[data-theme="mist"] {
  --bg: oklch(0.965 0.008 110);
  --bg-2: oklch(0.93 0.012 110);
  --bg-3: oklch(0.89 0.014 115);
  --fg: oklch(0.22 0.018 145);
  --fg-2: oklch(0.40 0.022 140);
  --fg-3: oklch(0.55 0.018 138);
  --line: oklch(0.78 0.018 130);
  --line-soft: oklch(0.86 0.014 120);
  --accent: oklch(0.45 0.08 140);
  --accent-2: oklch(0.55 0.07 138);
  --paper: oklch(0.22 0.018 145);
}

[data-theme="gold"] {
  --bg: oklch(0.13 0.012 60);
  --bg-2: oklch(0.17 0.014 65);
  --bg-3: oklch(0.21 0.016 65);
  --fg: oklch(0.92 0.018 80);
  --fg-2: oklch(0.74 0.030 78);
  --fg-3: oklch(0.55 0.030 75);
  --line: oklch(0.35 0.020 70);
  --line-soft: oklch(0.27 0.018 68);
  --accent: oklch(0.82 0.10 85);
  --accent-2: oklch(0.68 0.10 82);
  --paper: oklch(0.92 0.018 80);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body);
  font-feature-settings: "kern", "liga", "calt";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  line-height: 1.5;
  transition: background-color .6s ease, color .6s ease;
}
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }

::selection { background: var(--accent); color: var(--bg); }

.mono { font-family: var(--f-mono); font-feature-settings: "ss01"; }
.serif { font-family: var(--f-display); }
.uc { text-transform: uppercase; letter-spacing: 0.14em; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-3); }
.hairline { height: 1px; background: var(--line); width: 100%; }
.vline { width: 1px; background: var(--line); }

.container { width: 100%; max-width: 1480px; margin: 0 auto; padding: 0 56px; }
@media (max-width: 720px) { .container { padding: 0 24px; } }

/* ============================================================
   NAV
   ============================================================ */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 22px 56px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 32px;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-2);
  mix-blend-mode: difference;
  pointer-events: none;
}
.nav > * { pointer-events: auto; }
.nav .brand {
  display: flex; gap: 14px; align-items: baseline;
  color: var(--paper);
}
.nav .brand .mark {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 22px;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1;
}
.nav .brand .sub { font-size: 10px; opacity: 0.8; }
.nav .links { display: flex; gap: 28px; justify-content: center; color: var(--paper); }
.nav .links a:hover { color: var(--accent); }
.nav .right { display: flex; gap: 18px; justify-content: flex-end; align-items: center; color: var(--paper); }
.nav .lang { display: flex; gap: 8px; }
.nav .lang button { font: inherit; opacity: 0.5; padding: 4px 2px; letter-spacing: 0.16em; }
.nav .lang button.on { opacity: 1; border-bottom: 1px solid var(--paper); }
.nav .bag { display: flex; gap: 8px; align-items: center; }
.nav .bag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
@media (max-width: 900px) {
  .nav { padding: 18px 24px; grid-template-columns: 1fr auto; gap: 16px; }
  .nav .links { display: none; }
}

/* ============================================================
   HERO
   ============================================================ */
.hero {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  padding-bottom: 80px;
}
.hero .ridges { position: absolute; inset: 0; z-index: 0; }
.hero .ridges svg { position: absolute; left: 0; right: 0; width: 100%; height: 100%; }
.hero .vignette {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(120% 80% at 50% 100%, transparent 40%, color-mix(in oklab, var(--bg) 70%, transparent) 100%);
}
.hero .grid-marks {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.2em;
  color: color-mix(in oklab, var(--fg-3) 80%, transparent);
}
.hero .grid-marks .tick { position: absolute; display: flex; align-items: center; gap: 8px; }
.hero .grid-marks .tick::before { content: ""; width: 24px; height: 1px; background: currentColor; opacity: 0.6; }

.hero .content {
  position: relative; z-index: 3; width: 100%;
}
.hero .eyebrow-row {
  display: flex; justify-content: space-between; align-items: end;
  margin-bottom: 36px; gap: 24px;
  color: var(--paper);
}
.hero .display {
  font-family: var(--f-display);
  font-weight: 300;
  font-size: clamp(72px, 13vw, 220px);
  line-height: 0.86;
  letter-spacing: -0.02em;
  color: var(--paper);
  text-wrap: balance;
}
.hero .display .ln { display: block; }
.hero .display .ital { font-style: italic; color: var(--accent); }
.hero .display .out {
  color: color-mix(in oklab, var(--paper) 72%, transparent);
  opacity: 0.72;
  text-shadow:
    0 0 18px color-mix(in oklab, var(--accent) 10%, transparent),
    0 0 38px color-mix(in oklab, var(--paper) 12%, transparent);
}
@supports (-webkit-text-stroke: 1px currentColor) {
  .hero .display .out {
    color: transparent;
    -webkit-text-stroke: 1px var(--paper);
    opacity: 0.55;
    text-shadow: none;
  }
}
.hero .meta-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  margin-top: 60px; gap: 32px;
  border-top: 1px solid var(--line);
  padding-top: 24px;
  color: var(--paper);
}
.hero .meta-row .col .k { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.2em; opacity: 0.6; text-transform: uppercase; margin-bottom: 8px; }
.hero .meta-row .col .v { font-family: var(--f-display); font-style: italic; font-size: 24px; }
.hero .cta-row {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin-top: 28px;
}
.btn {
  display: inline-flex; align-items: center; gap: 14px;
  padding: 16px 22px;
  border: 1px solid var(--line);
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--paper);
  transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
}
.btn:hover { background: var(--paper); color: var(--bg); border-color: var(--paper); }
.btn .arr { font-family: var(--f-mono); }
.btn.solid { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.solid:hover { background: var(--paper); color: var(--bg); border-color: var(--paper); }

.hero .scroll-hint {
  position: absolute; bottom: 24px; left: 56px; z-index: 3;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--paper); opacity: 0.7;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.hero .scroll-hint .line { width: 1px; height: 40px; background: currentColor; animation: drop 1.8s ease-in-out infinite; transform-origin: top; }
@keyframes drop { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(0); transform-origin: bottom; } }

/* ============================================================
   MARQUEE
   ============================================================ */
.marquee {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
  background: var(--bg);
  padding: 22px 0;
}
.marquee .track {
  display: flex; gap: 64px;
  white-space: nowrap;
  animation: scroll-x 38s linear infinite;
  font-family: var(--f-display); font-style: italic;
  font-size: 36px; color: var(--fg-2);
}
.marquee .track span { display: flex; align-items: center; gap: 64px; }
.marquee .track span::after {
  content: "✦"; font-style: normal; color: var(--accent); font-size: 14px;
}
@keyframes scroll-x {
  to { transform: translateX(-50%); }
}

/* ============================================================
   ORIGIN
   ============================================================ */
.section { padding: 140px 0; position: relative; }
.section .head {
  display: grid; grid-template-columns: 1fr 2fr;
  gap: 48px;
  margin-bottom: 80px;
}
.section .head .eb { padding-top: 10px; }
.section .head h2 {
  font-family: var(--f-display);
  font-weight: 300;
  font-size: clamp(40px, 5.2vw, 84px);
  line-height: 1.02;
  letter-spacing: -0.015em;
  text-wrap: balance;
}
.section .head h2 em { font-style: italic; color: var(--accent); }
.section .lede {
  font-size: 18px;
  line-height: 1.65;
  color: var(--fg-2);
  max-width: 58ch;
  margin-top: 28px;
}
@media (max-width: 800px) {
  .section { padding: 96px 0; }
  .section .head { grid-template-columns: 1fr; gap: 16px; margin-bottom: 48px; }
}

.origin-photo {
  position: relative;
  margin-top: 60px;
  aspect-ratio: 16/9;
  border: 1px solid var(--line);
  overflow: hidden;
}
.origin-photo img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  filter: saturate(0.85) contrast(1.02);
}
.origin-photo .caption {
  position: absolute; left: 18px; bottom: 16px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--paper); mix-blend-mode: difference;
}

.altitude-chart {
  position: relative;
  margin-top: 80px;
  height: 460px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.altitude-chart .ygrid { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line-soft); display: flex; justify-content: space-between; padding: 0 0 0 0; }
.altitude-chart .ygrid .ylabel {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.18em;
  color: var(--fg-3); transform: translateY(-50%); padding: 0 6px; background: var(--bg);
}
.altitude-chart .peaks {
  position: absolute; inset: 0;
  display: flex; align-items: flex-end; justify-content: space-around;
  padding: 0 4%;
}
.altitude-chart .peak {
  position: relative;
  flex: 1;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer;
}
.altitude-chart .peak .stem {
  width: 1px; background: var(--fg-2);
  position: relative;
  transition: background .3s ease;
}
.altitude-chart .peak .stem::before {
  content: ""; position: absolute; left: 50%; bottom: 100%;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  transform: translate(-50%, 50%);
  box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 20%, transparent);
  transition: transform .3s ease, box-shadow .3s ease;
}
.altitude-chart .peak:hover .stem::before { transform: translate(-50%, 50%) scale(1.4); }
.altitude-chart .peak .label {
  position: absolute; bottom: -64px;
  text-align: center;
  width: 200px;
}
.altitude-chart .peak .code { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--fg-3); }
.altitude-chart .peak .name { font-family: var(--f-display); font-style: italic; font-size: 22px; margin-top: 4px; }
.altitude-chart .peak .alt { font-family: var(--f-mono); font-size: 11px; color: var(--accent); margin-top: 4px; letter-spacing: 0.1em; }
.altitude-chart .peak .note { font-size: 12px; color: var(--fg-3); margin-top: 8px; }
.altitude-chart .peak .alt-big {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translate(-50%, -16px);
  font-family: var(--f-display);
  font-weight: 300;
  font-size: clamp(32px, 3.4vw, 54px);
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--paper);
  white-space: nowrap;
  text-shadow: 0 2px 16px color-mix(in oklab, var(--bg) 80%, transparent);
  pointer-events: none;
  transition: color .3s ease, transform .3s ease;
}
.altitude-chart .peak:hover .alt-big { color: var(--accent); transform: translate(-50%, -22px); }

/* ============================================================
   FOGGY EDGE — soft feathered image edge
   ============================================================ */
.foggy-edge {
  position: relative;
  isolation: isolate;
  border: 0 !important;
  background: transparent !important;
  overflow: hidden;
  -webkit-mask-image: radial-gradient(ellipse 112% 108% at 50% 50%, #000 48%, rgba(0,0,0,.94) 58%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.38) 82%, transparent 100%);
          mask-image: radial-gradient(ellipse 112% 108% at 50% 50%, #000 48%, rgba(0,0,0,.94) 58%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.38) 82%, transparent 100%);
}
.foggy-edge::after {
  content: "";
  position: absolute;
  inset: -8%;
  pointer-events: none;
  background:
    radial-gradient(ellipse 78% 74% at 50% 50%, transparent 58%, color-mix(in oklab, var(--paper) 7%, transparent) 73%, color-mix(in oklab, var(--bg) 18%, transparent) 100%);
  mix-blend-mode: screen;
  opacity: 0.95;
}
.foggy-edge .caption, .foggy-edge .corner { z-index: 5; }

/* ============================================================
   STORY
   ============================================================ */
.story-grid {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 80px;
  align-items: start;
}
@media (max-width: 900px) { .story-grid { grid-template-columns: 1fr; gap: 40px; } }
.story-grid p {
  font-size: 17px; line-height: 1.7; color: var(--fg-2);
  margin-bottom: 22px;
  text-indent: 2em;
}
.story-grid .img-wrap {
  position: relative; aspect-ratio: 4/5;
  border: 1px solid var(--line);
  overflow: hidden;
}
.story-grid .img-wrap .caption {
  position: absolute; left: 14px; bottom: 14px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--paper); mix-blend-mode: difference;
}
.story-grid .img-wrap .corner {
  position: absolute; right: 14px; top: 14px;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.18em;
  color: var(--paper); mix-blend-mode: difference;
}

.stat-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin-top: 80px;
}
.stat-row .cell {
  background: var(--bg);
  padding: 32px 24px;
}
.stat-row .n {
  font-family: var(--f-display);
  font-size: clamp(40px, 5vw, 64px);
  line-height: 1;
  font-weight: 300;
  letter-spacing: -0.02em;
}
.stat-row .n em { color: var(--accent); font-style: italic; }
.stat-row .l {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--fg-3); margin-top: 14px;
}
@media (max-width: 720px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }

/* ============================================================
   SERIES
   ============================================================ */
.series-list { border-top: 1px solid var(--line); }
.series-row {
  display: grid;
  grid-template-columns: 72px 1.4fr 1fr 90px 110px 1fr;
  gap: 24px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 22px 8px;
  position: relative;
  transition: background .25s ease, padding .25s ease;
  cursor: pointer;
}
.series-row:hover { background: var(--bg-2); padding-left: 24px; }
.series-row .thumb {
  width: 64px; height: 64px;
  border: 1px solid var(--line-soft);
  overflow: hidden;
  background: var(--bg-2);
  flex-shrink: 0;
}
.series-row .thumb img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  filter: saturate(0.85) contrast(1.02);
  transition: transform .35s ease;
}
.series-row:hover .thumb img { transform: scale(1.06); }
.series-row .idx-small {
  display: block;
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fg-3); margin-bottom: 4px;
}
.series-row .cn { font-family: var(--f-display); font-size: 30px; font-weight: 300; letter-spacing: -0.01em; }
.series-row .en { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
.series-row .w { font-family: var(--f-mono); font-size: 11px; color: var(--fg-2); }
.series-row .p { font-family: var(--f-display); font-style: italic; font-size: 22px; color: var(--fg); }
.series-row .tag {
  display: inline-block;
  font-family: var(--f-mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 4px 8px;
  border: 1px solid var(--accent); color: var(--accent);
  margin-left: 12px;
}
.series-row .add {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--fg-3);
  text-align: right;
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
  opacity: 0; transform: translateX(-8px); transition: all .3s ease;
}
.series-row:hover .add { opacity: 1; transform: translateX(0); color: var(--fg); }
.series-row .add .arr { width: 24px; height: 1px; background: currentColor; position: relative; }
.series-row .add .arr::after { content: ""; position: absolute; right: 0; top: -3px; border: 1px solid currentColor; border-left: 0; border-bottom: 0; width: 7px; height: 7px; transform: rotate(45deg); }

@media (max-width: 1100px) {
  .series-row { grid-template-columns: 64px 1.4fr 90px 1fr; }
  .series-row .en, .series-row .w { display: none; }
}
@media (max-width: 640px) {
  .series-row { grid-template-columns: 56px 1fr 1fr; padding: 18px 4px; }
  .series-row .add { display: none; }
  .series-row .cn { font-size: 22px; }
  .series-row .thumb { width: 56px; height: 56px; }
}

/* ============================================================
   GIFT (3D)
   ============================================================ */
.gift {
  background: var(--bg-2);
  padding: 140px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.gift-grid {
  display: grid; grid-template-columns: 1fr 1.05fr; gap: 64px;
  align-items: center;
}
@media (max-width: 900px) { .gift-grid { grid-template-columns: 1fr; gap: 48px; } }

.gift-stage {
  perspective: 1400px;
  height: 540px;
  position: relative;
  user-select: none;
  cursor: grab;
}
.gift-stage:active { cursor: grabbing; }
.gift-stage .floor {
  position: absolute; left: 50%; bottom: 22%;
  width: 360px; height: 30px;
  transform: translateX(-50%) rotateX(80deg);
  background: radial-gradient(ellipse at center, color-mix(in oklab, var(--accent) 35%, transparent) 0%, transparent 65%);
  filter: blur(8px);
  opacity: 0.55;
}
.box {
  position: absolute; top: 50%; left: 50%;
  width: 320px; height: 220px;
  transform-style: preserve-3d;
  transform: translate(-50%, -55%) rotateX(-18deg) rotateY(-28deg);
  transition: transform .15s ease;
}
/* ---- ribbon/band around box (wraps all 4 sides) ---- */
.box .ribbon {
  position: absolute;
  top: 36%; left: 0; right: 0;
  height: 3px;
  margin-top: -1.5px;
  background: linear-gradient(90deg,
    transparent 0%, transparent 4%,
    var(--accent-2) 4%, var(--accent) 20%, var(--accent-2) 50%, var(--accent) 80%, var(--accent-2) 96%,
    transparent 96%, transparent 100%);
  z-index: 10;
}
.box .ribbon.front { transform: translateZ(61px); }
.box .ribbon.back { transform: rotateY(180deg) translateZ(61px); }

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

function MountainRidge({ y, opacity, color, seed = 1, height = 0.42 }) {
  const W = 1440;

  const points = [];
  const baseY = H * (1 - height);
  let lastY = baseY;
  const seg = 28 + seed * 3;
  for (let i = 0; i <= seg; i++) {
    const x = (i / seg) * W;
    const rand = Math.sin(i * 1.7 + seed * 4.31) * 0.5 + Math.sin(i * 0.9 + seed * 2.13) * 0.5;
    const peakHeight = (50 + Math.abs(rand) * 110) * (1 - seed * 0.15);
    const y2 = baseY + rand * 18 - peakHeight * Math.max(0, Math.sin(i / seg * Math.PI));
    lastY = lastY * 0.4 + y2 * 0.6;
    points.push([x, lastY]);
  }
  const d = "M0," + H + " L" + points.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " L" + W + "," + H + " Z";

  return (
    <svg
      viewBox={`0 0 ${W} ${H}`}
      preserveAspectRatio="none"
      style={{
        transform: `translateY(${y}px)`,
        opacity,
        position: "absolute",
        left: 0, right: 0, bottom: 0,
        height: "100%",
      }}
    >
      <path d={d} fill={color} />
    </svg>
  );
}

const { useState: gUseState, useEffect: gUseEffect, useRef: gUseRef } = React;

function GiftBox({ t, autoRotate = true }) {
  const stageRef = gUseRef(null);
  const [rot, setRot] = gUseState({ x: -16, y: -32 });
  const dragRef = gUseRef({ active: false, startX: 0, startY: 0, rotX: 0, rotY: 0 });

  gUseEffect(() => {
    if (!autoRotate) return;
    let raf;
    let lastT = performance.now();
    const tick = (now) => {
      const dt = (now - lastT) / 1000;
      lastT = now;
      if (!dragRef.current.active) {
        setRot(r => ({ x: r.x, y: r.y + dt * 6 }));
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [autoRotate]);

  const onDown = (e) => {
    const p = e.touches ? e.touches[0] : e;
    dragRef.current = {
      active: true,
      startX: p.clientX,
      startY: p.clientY,
      rotX: rot.x,
      rotY: rot.y,
    };
  };
  const onMove = (e) => {
    if (!dragRef.current.active) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - dragRef.current.startX;
    const dy = p.clientY - dragRef.current.startY;
    setRot({
      x: Math.max(-60, Math.min(40, dragRef.current.rotX - dy * 0.4)),
      y: dragRef.current.rotY + dx * 0.45,
    });
  };
  const onUp = () => { dragRef.current.active = false; };

    window.addEventListener("mouseup", onUp);

    window.addEventListener("touchend", onUp);

            ]}
          />
        </TweakSection>
        <TweakSection label="Motion">
          <TweakToggle label="Parallax scroll" value={tweaks.parallax} onChange={(v) => setTweak("parallax", v)} />
          <TweakToggle label="Auto-rotate gift box" value={tweaks.autoRotateBox} onChange={(v) => setTweak("autoRotateBox", v)} />
          <TweakToggle label="Show coordinates" value={tweaks.showGridMarks} onChange={(v) => setTweak("showGridMarks", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
